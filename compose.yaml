name: tomato-multicontainer

services:
  web:
    build:
      context: ./frontend
    container_name: tomato-web
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      VITE_API_URL: http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tomato-net
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: tomato-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@db:27017/${MONGO_DATABASE}?authSource=admin
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
    networks:
      - tomato-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db:
    image: mongo:8.0
    container_name: tomato-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db
      - ./db/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tomato-net
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    container_name: tomato-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@db:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - "8080:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tomato-net
    restart: unless-stopped

volumes:
  db_data:
  api_uploads:

networks:
  tomato-net:
    driver: bridge